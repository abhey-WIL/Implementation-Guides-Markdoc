name: Build Markdoc index

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/build/**'
      - 'README.md'
      - '.github/workflows/ev-docs-pages.yml'
  workflow_dispatch: {}

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # so we can push back

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build index.md from Markdoc
        run: |
          python docs/build/script.py docs/build/index.mdoc -o docs/index.md

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if ! git diff --quiet; then
            git add docs/index.md
            git commit -m "chore: rebuild Beckn Implementation Guide index" || echo "No changes to commit"
            git push
          else
            echo "No changes in index.md"
          fi
